name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".gitea/workflows/backend-ci.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".gitea/workflows/backend-ci.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Test tích hợp dùng Testcontainers nên runner phải gọi được Docker daemon.
      - name: Build và chạy test
        run: ./mvnw -B -ntp verify
